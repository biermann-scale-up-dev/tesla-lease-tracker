name: lease-tracker-tests
services:
  broker:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    command: [redpanda, start, --mode, dev-container, --smp, "1", --memory, 1G, --reserve-memory, 0M, --node-id, "0", --kafka-addr, PLAINTEXT://0.0.0.0:19092, --advertise-kafka-addr, PLAINTEXT://127.0.0.1:19092]
    ports: ["127.0.0.1:19092:19092"]
    healthcheck:
      test: [CMD, rpk, cluster, health, --exit-when-healthy]
      interval: 5s
      timeout: 5s
      retries: 20
